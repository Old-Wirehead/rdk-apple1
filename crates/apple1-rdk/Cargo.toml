[package]
name = "apple1-rdk"
description = "Retro Dev Kit Apple 1 2.0 : l'Apple 1 (6502, PIA 6820, Woz Monitor, ACI) branché sur RDK-Interface-Commune 0.1.9 (pilotes), programme retro-dev-kit-apple1."
version = "2.0.0"
rust-version = "1.95"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Wirehead"]
repository = "https://github.com/Old-Wirehead/rdk-apple1"

build = "build.rs"

[lib]
name = "apple1_rdk"
path = "src/lib.rs"

# Le binaire de la v1.0 s'appelle `apple1-emu-gui` (paquet apple1-gui) : il
# reste intact. Celui de la 2.0 s'appelle `retro-dev-kit-apple1`.
[[bin]]
name = "retro-dev-kit-apple1"
path = "src/main.rs"

# La machine vient du noyau de la v1.0 (apple1-core, dans ce dépôt) ;
# l'interface vient de RDK-Interface-Commune, épinglée sur le commit de
# fusion de la version 0.1.9 (étiquette v0.1.9, PR n° 21 : Dump, Désassemblage,
# Bibliothèque, assistant et barre d'icônes au niveau de la v1.0, contrat des
# pilotes 1.0.0 ; 0.1.8, PR n° 11 : zoom « Ajuster » corrigé, barre
# d'icônes compacte quand elle déborde ; 0.1.7, PR n° 10 : 7 langues, zoom
# « Ajuster », menu 📸 État relié à la machine ; 0.1.6 : phosphore du moniteur
# monochrome ; 0.1.5 : bibliothèques, ROM, formats, configurations).
# 0.1.10 (main après RDK-Interface-Commune#26, 47a2645) : contrat des pilotes
# 1.1.0 (points d'arrêt, réglages d'écran, routines de la ROM).
# 0.1.11 (main après RDK-Interface-Commune#50, 9fa6da7) : lots 1 à 3 de la campagne de Claude
# Testeur Apple 1, case unique « Écran vintage », onglet ⚙ Préférences → Écran,
# image centrée ; contrat des pilotes inchangé (1.1.0).
# Changer de version de l'interface commune = changer ces deux révisions, ensemble.
[dependencies]
apple1-core = { path = "../apple1-core" }
rdk-pilotes = { git = "https://github.com/Old-Wirehead/RDK-Interface-Commune", rev = "0bb6764dbaec423af04784adbd3591478ef58649" }
rdk-interface = { git = "https://github.com/Old-Wirehead/RDK-Interface-Commune", rev = "0bb6764dbaec423af04784adbd3591478ef58649" }
# Même version que celle utilisée par rdk-interface (type de retour de `main`).
eframe = { version = "0.36", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
# Comme la v1.0 (apple1-gui) : cassettes reconnues (SHA-256), photos → art ASCII.
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Comme la v1.0 (apple1-gui), pour ses modules repris (`crate::v1`) :
# réglages par programme (programs.json), projets GitHub (réseau, archives
# d'artefacts), son de la cassette (ALSA ouvert au lancement, sans lien).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
libloading = "0.8"

# Espace de travail à part (exclu de celui de la v1.0, à la racine) : la
# v1.0 se construit sans accès au dépôt privé RDK-Interface-Commune.
# Construire : `cargo build --release` dans ce dossier.
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Les essais de cassette émulent des millions de cycles du 6502 : optimisés.
[profile.test]
opt-level = 3
