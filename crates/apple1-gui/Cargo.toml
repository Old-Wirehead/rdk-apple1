[package]
name = "apple1-gui"
description = "Retro Dev Kit Apple 1 : interface graphique (egui) avec bibliotheque de programmes."
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "apple1-emu-gui"
path = "src/main.rs"

[dependencies]
apple1-core = { path = "../apple1-core" }
eframe = { version = "0.36", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
egui-file-dialog = "0.15"
egui_dock = { version = "0.21", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
libloading = "0.8"
arboard = { version = "3.7", default-features = false }
